<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaWeb | Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Nova<span>Web</span></div>
            <button id="menuToggle" class="icon-btn menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="about.html"><i class="fas fa-info-circle"></i> About Us</a></li>
                <li><a href="contact.html" class="active"><i class="fas fa-envelope"></i> Contact</a></li>
                <li><button id="themeToggle" class="icon-btn" aria-label="Switch light/dark theme"><i class="fas fa-moon"></i></button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Contact Us</h1>
        <p class="justified-text">Have a question or want to work together? Fill out the form below and we will get back to you as soon as possible.</p>

        <div class="contact-wrapper">
            <form id="contactForm" class="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                    <small class="error" id="nameError"></small>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <small class="error" id="emailError"></small>
                </div>
                <div class="form-group">
                    <label for="subject">Topic</label>
                    <select id="subject">
                        <option value="general">General question</option>
                        <option value="quote">Request a quote</option>
                        <option value="support">Support</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" maxlength="300" placeholder="Write your message here" required></textarea>
                    <small class="counter"><span id="charCount">0</span>/300 characters</small>
                    <small class="error" id="messageError"></small>
                </div>
                <button type="submit" class="btn">Send Message</button>
                <p id="formFeedback" class="feedback-msg" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <button id="backToTop" class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>

    <footer>
        <p>&copy; 2026 NovaWeb Solutions. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
